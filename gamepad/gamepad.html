<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gamepad</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body { background: #1a1a2e; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; touch-action: none; }
#status { text-align: center; color: #aaa; font-size: 12px; padding: 4px; font-family: sans-serif; }
#status.ok { color: #4ade80; }
#controls { display: flex; flex: 1; align-items: center; justify-content: space-between; padding: 10px 20px; }

/* D-Pad */
#dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 4px; }
.dpad-btn { background: #2d2d4e; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; cursor: pointer; }
.dpad-center { background: transparent; }
.dpad-btn:active, .dpad-btn.pressed { background: #4f46e5; }

/* Center buttons */
#center { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#center-row { display: flex; gap: 12px; }
.sys-btn { background: #2d2d4e; border-radius: 20px; padding: 8px 16px; color: #ccc; font-size: 13px; font-family: sans-serif; cursor: pointer; }
.sys-btn:active, .sys-btn.pressed { background: #4f46e5; color: white; }

/* ABXY */
#abxy { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 4px; }
.face-btn { background: #2d2d4e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; font-family: sans-serif; color: white; cursor: pointer; }
.face-btn:active, .face-btn.pressed { background: #4f46e5; }
.face-empty { background: transparent; }
#btn-a { color: #4ade80; }
#btn-b { color: #f87171; }
#btn-x { color: #60a5fa; }
#btn-y { color: #facc15; }

/* Shoulder buttons */
#shoulders { display: flex; justify-content: space-between; padding: 0 20px 10px; gap: 10px; }
.shoulder { flex: 1; background: #2d2d4e; border-radius: 12px; padding: 12px; text-align: center; color: white; font-size: 16px; font-family: sans-serif; cursor: pointer; }
.shoulder:active, .shoulder.pressed { background: #4f46e5; }
</style>
</head>
<body>
<div id="status">Verbinde...</div>
<div id="shoulders">
  <div class="shoulder" data-btn="l">L</div>
  <div class="shoulder" data-btn="r">R</div>
</div>
<div id="controls">
  <div id="dpad">
    <div class="dpad-center"></div>
    <div class="dpad-btn" data-btn="up">▲</div>
    <div class="dpad-center"></div>
    <div class="dpad-btn" data-btn="left">◀</div>
    <div class="dpad-center"></div>
    <div class="dpad-btn" data-btn="right">▶</div>
    <div class="dpad-center"></div>
    <div class="dpad-btn" data-btn="down">▼</div>
    <div class="dpad-center"></div>
  </div>
  <div id="center">
    <div id="center-row">
      <div class="sys-btn" data-btn="select">SELECT</div>
      <div class="sys-btn" data-btn="start">START</div>
    </div>
  </div>
  <div id="abxy">
    <div class="face-empty"></div>
    <div class="face-btn" id="btn-y" data-btn="y">Y</div>
    <div class="face-empty"></div>
    <div class="face-btn" id="btn-x" data-btn="x">X</div>
    <div class="face-empty"></div>
    <div class="face-btn" id="btn-a" data-btn="a">A</div>
    <div class="face-empty"></div>
    <div class="face-btn" id="btn-b" data-btn="b">B</div>
    <div class="face-empty"></div>
  </div>
</div>

<script>
const HOST = location.hostname;
let ws;
const status = document.getElementById('status');

function connect() {
  ws = new WebSocket('ws://' + HOST + ':8765');
  ws.onopen = () => { status.textContent = '🎮 Verbunden'; status.className = 'ok'; };
  ws.onclose = () => { status.textContent = 'Getrennt – verbinde neu...'; status.className = ''; setTimeout(connect, 2000); };
}
connect();

function send(btn, pressed) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({btn, pressed}));
}

document.querySelectorAll('[data-btn]').forEach(el => {
  const btn = el.dataset.btn;
  el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('pressed'); send(btn, 1); });
  el.addEventListener('touchend',   e => { e.preventDefault(); el.classList.remove('pressed'); send(btn, 0); });
  el.addEventListener('mousedown',  e => { el.classList.add('pressed'); send(btn, 1); });
  el.addEventListener('mouseup',    e => { el.classList.remove('pressed'); send(btn, 0); });
});
</script>
</body>
</html>
